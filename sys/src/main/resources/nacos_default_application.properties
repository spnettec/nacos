# Nacos Default Properties

nacos.version=${project.version}

## Web Server
server.servlet.contextPath=/nacos
nacos.server.main.port=8848
server.tomcat.uri-encoding=UTF-8

nacos.console.port=8080
nacos.core.auth.server.identity.key=serverIdentity
nacos.core.auth.server.identity.value=security
nacos.core.auth.plugin.nacos.token.secret.key=SecretKey012345678901234567890123456789012345678901234567890123456789
## HTTP Encoding
spring.http.encoding.force=true
spring.http.encoding.enabled=true

## i18n
spring.messages.encoding=UTF-8

## Exclude Spring Boot Auto-Configuration class(es)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.ldap.autoconfigure.LdapAutoConfiguration
