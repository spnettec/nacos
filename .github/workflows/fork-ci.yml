name: Fork dependency verification and tests
on:
  push:
    branches: [heyoulin]
  pull_request:
    branches: [heyoulin]
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'spnettec/nacos'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test dependency source selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_maven_source.py'
      - name: Select and verify fork dependency source
        timeout-minutes: 25
        id: dependency-source
        env:
          YOFC_MAVEN_USERNAME: ${{ secrets.YOFC_MAVEN_USERNAME }}
          YOFC_MAVEN_PASSWORD: ${{ secrets.YOFC_MAVEN_PASSWORD }}
          PACKAGES_USER: ${{ vars.PACKAGES_USER || github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: python3 .github/scripts/select_maven_source.py
      - name: Test Nacos
        env:
          CI_MAVEN_SETTINGS: ${{ steps.dependency-source.outputs.settings }}
        run: mvn -s "$CI_MAVEN_SETTINGS" -B -ntp clean test
