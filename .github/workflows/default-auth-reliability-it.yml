# This workflow exercises destructive restart and multi-node scenarios outside the required PR IT.

name: Default Auth Reliability Integration Test

on:
  push:
    branches: [heyoulin]
    paths:
      - '.github/workflows/default-auth-reliability-it.yml'
      - 'test/scripts/default-auth-reliability-it.sh'
  workflow_dispatch:
    inputs:
      suite:
        description: Reliability suite to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - standalone
          - cluster
  schedule:
    # Monday 02:00 Asia/Shanghai.
    - cron: '0 18 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reliability-test:
    name: Auth-on restart and cluster reliability
    # Each job gets a fresh VM; restart tests must not share a production host.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Select and verify fork dependency source
        id: dependency-source
        timeout-minutes: 25
        env:
          YOFC_MAVEN_USERNAME: ${{ secrets.YOFC_MAVEN_USERNAME }}
          YOFC_MAVEN_PASSWORD: ${{ secrets.YOFC_MAVEN_PASSWORD }}
        run: python3 .github/scripts/select_maven_source.py

      - name: Use verified dependencies for build and nested test Maven commands
        env:
          CI_MAVEN_SETTINGS: ${{ steps.dependency-source.outputs.settings }}
        run: echo "MAVEN_ARGS=-s $CI_MAVEN_SETTINGS" >> "$GITHUB_ENV"

      - name: Build release distribution
        run: mvn -B '-Prelease-nacos,!dev' -Dmaven.test.skip=true clean install

      - name: Run default-auth reliability suite
        shell: bash
        env:
          SELECTED_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}
        run: bash test/scripts/default-auth-reliability-it.sh "$SELECTED_SUITE"

      - name: Upload reliability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-auth-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/default-auth-reliability
          if-no-files-found: warn
          retention-days: 14
